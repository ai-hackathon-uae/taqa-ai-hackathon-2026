<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAQA AI Hackathon 2026</title>
<meta name="theme-color" content="#16162e">
<style>
  :root{color-scheme:dark;--navy:#16162e;--cyan:#029dc9;--sky:#7fd8f2;--ink:#d6eef7;
        --glass:rgba(255,255,255,.09);--line:rgba(255,255,255,.22)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:#16162e}
  body{font-family:Arial,Helvetica,sans-serif;font-size:16px;color:#fff;min-height:100vh;
       background:linear-gradient(160deg,#16162e 0%,#162641 50%,#0f5f86 82%,#029dc9 100%);background-attachment:fixed;
       padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{width:100%;max-width:480px;margin:0 auto;padding-block:20px 40px}
  .banner{display:block;width:100%;height:auto;border-radius:14px;margin-bottom:18px}
  h1{font-size:30px;line-height:1.15;font-weight:800;text-wrap:balance}
  .sub{font-size:14px;color:var(--ink);line-height:1.5;margin-top:4px}
  .tabs{display:flex;gap:6px;margin:18px 0}
  .tabs button{flex:1;min-width:0;padding:10px 0;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;
       color:var(--ink);font:700 13px Arial,sans-serif;cursor:pointer}
  .tabs button.on{background:#fff;color:var(--navy);border-color:#fff}
  .tabs button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

  .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0}
  .card h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sky);margin-bottom:10px}

  select{width:100%;padding:13px 12px;border-radius:10px;border:0;font:16px Arial,sans-serif;color:var(--navy);background:#fff}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;color:#fff;background:var(--cyan);border:0;
       border-radius:12px;padding:14px;font:800 16px Arial,sans-serif;margin-top:10px;cursor:pointer}
  .btn.off{opacity:.45;pointer-events:none}
  .btn.done{background:#1e9e6a}
  .modal{position:fixed;inset:0;background:rgba(10,12,30,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal[hidden]{display:none}
  .mbox{width:100%;max-width:380px;background:#fff;color:var(--navy);border-radius:20px;padding:26px 22px;text-align:center}
  .mbox .tick{width:56px;height:56px;border-radius:50%;background:#1e9e6a;color:#fff;font-size:32px;line-height:56px;margin:0 auto 12px}
  .mbox h3{font-size:22px;line-height:1.25}
  .mbox p{font-size:15px;color:#4a4f63;margin-top:6px;line-height:1.5}
  .mbox .big{display:inline-block;margin-top:14px;font-size:15px;color:#4a4f63}
  .mbox .big b{display:block;font-size:46px;color:var(--navy);line-height:1.1}
  .mbox .demo{font-size:12px;color:#a35a00;margin-top:10px}
  .mbox button{margin-top:18px;width:100%;border:0;border-radius:12px;padding:13px;background:var(--cyan);color:#fff;font:800 16px Arial,sans-serif;cursor:pointer}
  .table{font-size:15px;line-height:1.4}
  .table b{display:inline-block;background:#fff;color:var(--navy);border-radius:10px;padding:2px 12px;font-size:22px;margin-left:4px}
  .muted{font-size:14px;color:var(--ink);line-height:1.5}
  ol{margin:6px 0 0 20px;font-size:14px;line-height:1.6;color:#eaf8fd}
  .row{font-size:14px;line-height:1.7}
  .row b{color:var(--sky)}
  .pw{font-family:Consolas,monospace;background:rgba(0,0,0,.25);padding:1px 6px;border-radius:6px}

  /* agenda */
  .ag-head{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
  .ag-title{font-size:20px;font-weight:800;line-height:1.2;text-wrap:balance}
  .ag-obj{font-size:14px;color:var(--ink);line-height:1.5}
  .ag-obj b{color:var(--sky);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
  .ag-meta{font-size:13px;color:var(--ink);margin-top:2px}
  .batches{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
  .batches button{flex:1 1 140px;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--ink);font:700 12px Arial,sans-serif;cursor:pointer}
  .batches button.on{background:var(--sky);color:var(--navy);border-color:var(--sky)}
  .tl{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .s{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid transparent}
  .s .tm{font-size:13px;font-weight:800;line-height:1.3}
  .s .tm span{display:block;font-weight:400;color:var(--ink);font-size:12px}
  .s .tt{font-size:15px;font-weight:700;line-height:1.3}
  .s .dd{font-size:13px;color:var(--ink);line-height:1.5;margin-top:3px}
  .s .oo{font-size:12px;color:var(--sky);margin-top:5px;line-height:1.4}
  .chip{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:var(--sky);border-radius:20px;padding:2px 9px;margin:6px 4px 0 0}
  .s.break{background:transparent;border:1px dashed rgba(255,255,255,.28);padding:8px 12px}
  .s.break .tt{font-weight:400;font-size:14px;color:var(--ink)}
  .s.break .dd{margin-top:1px}
  .s.past{opacity:.5}
  .s.now{background:rgba(2,157,201,.38);border-color:var(--sky)}
  .tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.08em;background:var(--sky);color:var(--navy);border-radius:8px;padding:2px 6px;vertical-align:middle}
  .fb{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;color:var(--navy);background:#fff;border-radius:20px;padding:5px 12px;text-decoration:none}
  .callout{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(127,216,242,.14);border:1px solid rgba(127,216,242,.4);font-size:13px;line-height:1.5}
  .callout b{color:var(--sky)}
  .foot{margin-top:16px;text-align:center;font-size:12px;color:#8fb6c6}

  /* order on phone */
  #cReg{order:1}#cTable{order:2}#cAgenda{order:3}#cInfo{order:4}#cPhotos{order:5}#cSurvey{order:6}

  /* laptop and desktop */
  @media (min-width:900px){
    .wrap{max-width:1040px;padding-block:28px 56px}
    h1{font-size:38px}
    .tabs{max-width:560px}
    .grid{grid-template-columns:340px minmax(0,1fr);grid-template-rows:auto auto auto auto auto 1fr;gap:16px;align-items:start}
    #cReg{grid-column:1;grid-row:1;order:0}#cTable{grid-column:1;grid-row:2;order:0}
    #cInfo{grid-column:1;grid-row:3;order:0}#cPhotos{grid-column:1;grid-row:4;order:0}#cSurvey{grid-column:1;grid-row:5;order:0}
    #cAgenda{grid-column:2;grid-row:1 / -1;order:0;padding:22px 24px}
    .s{grid-template-columns:96px minmax(0,1fr);padding:14px 16px}
  }
  @media (prefers-reduced-motion:no-preference){.s{transition:opacity .2s}}
</style>
</head>
<body>
<div class="wrap">
  <img class="banner" src="banner.jpg" alt="TAQA AI Hackathon">
  <h1 id="welcome">Welcome</h1>
  <p class="sub" id="daysub"></p>
  <div class="tabs" id="tabs"></div>

  <div class="grid">
    <div class="card" id="cReg">
      <h2>Register your attendance</h2>
      <select id="who" aria-label="Your name"><option value="">Select your name</option></select>
      <div class="muted" id="lockMsg" style="margin-top:8px" hidden></div>
      <button class="btn off" id="register" type="button" disabled>Register attendance</button>
      <div class="muted" id="regMsg" role="status" style="margin-top:8px"></div>
    </div>

    <div class="card" id="cTable">
      <h2>Your table</h2>
      <div class="table" id="table"></div>
    </div>

    <div class="card" id="cAgenda">
      <h2>Agenda</h2>
      <div class="ag-head">
        <div class="ag-title" id="agT"></div>
        <div class="ag-obj" id="agO"></div>
        <div class="ag-meta" id="agM"></div>
      </div>
      <div class="batches" id="batches"></div>
      <ul class="tl" id="tl"></ul>
      <div class="callout" id="note" hidden></div>
      <p class="foot" id="foot"></p>
    </div>

    <div class="card" id="cInfo">
      <h2>Helpful details</h2>
      <div class="row"><b>Prayer room</b><ol id="prayer"></ol></div>
      <div class="row" style="margin-top:10px"><b>Wi-Fi</b> <span id="wifi"></span></div>
      <div class="row" style="margin-top:10px"><b>Venue</b> <span id="venue"></span></div>
    </div>

    <div class="card" id="cPhotos">
      <h2>Share your photos</h2>
      <div class="muted">Took pictures during the event? Add them here.</div>
      <button class="btn" id="photoBtn" type="button">Add photos</button>
      <input id="photoInput" type="file" accept="image/*" multiple hidden>
      <div class="muted" id="photoMsg" role="status" style="margin-top:8px"></div>
    </div>

    <div class="card" id="cSurvey">
      <h2>Share your feedback</h2>
      <div class="muted" id="svT"></div>
      <a class="btn" id="survey" href="#" target="_blank" rel="noopener">Give feedback</a>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbox">
    <div class="tick">&#10003;</div>
    <h3 id="mTitle"></h3>
    <p id="mSub"></p>
    <div class="big" id="mTable"></div>
    <div class="demo" id="mDemo" hidden>Test mode: this check-in was not saved.</div>
    <button type="button" id="mClose">Done</button>
  </div>
</div>

<script src="config.js"></script>
<script src="people.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const ABU = { timeZone: 'Asia/Dubai' };
const todayStr = () => new Intl.DateTimeFormat('en-CA', ABU).format(new Date());
const nowMin = () => { const p = new Intl.DateTimeFormat('en-GB', {...ABU, hour:'2-digit', minute:'2-digit', hourCycle:'h23'}).formatToParts(new Date());
  return +p.find(x=>x.type==='hour').value*60 + +p.find(x=>x.type==='minute').value; };
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = t => { let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return h+':'+String(m).padStart(2,'0')+' '+ap; };

function pickDay(){
  const q = parseInt(new URLSearchParams(location.search).get('day'), 10);
  if (q >= 1 && q <= CONFIG.days.length) return q-1;
  const t = todayStr(), i = CONFIG.days.findIndex(d => d.date === t);
  if (i >= 0) return i;
  const next = CONFIG.days.findIndex(d => d.date > t);
  return next >= 0 ? next : CONFIG.days.length-1;
}
let day = pickDay(), batch = nowMin() >= 12*60+30 ? 1 : 0;

const people = CONFIG.people;
const groups = []; people.forEach(p => { const g = p.g || 'Participants'; if (groups.indexOf(g) < 0) groups.push(g); });
$('who').innerHTML += groups.map(g => `<optgroup label="${esc(g)}">` + people.map((p,i) => (p.g || 'Participants') === g ? `<option value="${i}">${esc(p.n)}</option>` : '').join('') + '</optgroup>').join('');
const saved = store.get('hk_who');
if (saved !== null && people[saved]) $('who').value = saved;
let pending = false;
// Days where attendance can be marked. Add a day to openDays in config.js to unlock it.
const openDays = Array.isArray(CONFIG.openDays) ? CONFIG.openDays : ['Day 1'];
const isOpen = d => openDays.indexOf(d.label) >= 0;
// One phone, one person: once someone registers, this phone stays on their name.
const meName = store.get('hk_me');
const meIdx = meName ? people.findIndex(p => p.n === meName) : -1;
if (meIdx >= 0) {
  $('who').value = meIdx; $('who').disabled = true;
  $('lockMsg').hidden = false;
  $('lockMsg').textContent = 'This phone is registered to ' + meName + '. If this is wrong, please ask the registration desk.';
}
function deviceId(){
  let id = store.get('hk_dev');
  if (!id) { id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('hk_dev', id); }
  return id;
}

$('tabs').innerHTML = CONFIG.days.map((d,i) => `<button data-i="${i}">${esc(d.label)}</button>`).join('');
$('tabs').onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { day = +i; pending = false; $('regMsg').textContent = ''; render(); } };
$('who').onchange = () => { store.set('hk_who', $('who').value); pending = false; $('regMsg').textContent = ''; render(); };
$('batches').onclick = e => { const b = e.target.dataset.b; if (b !== undefined) { batch = +b; render(); } };

function render(){
  const d = CONFIG.days[day], p = people[$('who').value];
  const isToday = d.date === todayStr();
  document.querySelectorAll('#tabs button').forEach((b,i) => b.classList.toggle('on', i === day));
  $('welcome').textContent = 'Welcome to ' + d.label;
  $('daysub').textContent = d.title;

  // register
  const reg = $('register');
  const open = isOpen(d);
  const done = !!p && isReg(p.n, d.label);
  reg.disabled = !p || !open; reg.classList.toggle('off', !p || !open); reg.classList.toggle('done', done);
  reg.textContent = !open ? 'Attendance opens on the day' : done ? 'You are marked present' : pending && p ? 'Confirm: I am ' + p.n : 'Register attendance';

  // table
  $('cTable').hidden = d.showTables === false;
  if (!open) $('regMsg').textContent = 'Attendance for ' + d.label + ' opens on the morning of the day.';
  const t = p && p.t[day];
  $('table').innerHTML = !p ? '<span class="muted">Select your name above to see your table.</span>'
    : !open ? '<span class="muted">Your table will appear here once attendance opens.</span>'
    : !done ? '<span class="muted">Register your attendance above to see your table.</span>'
    : t ? `Please sit at table <b>${esc(t)}</b>${p.note ? '<div class="muted" style="margin-top:10px;white-space:pre-line">' + esc(p.note) + '</div>' : ''}`
    : p.note ? `<span class="muted" style="white-space:pre-line">${esc(p.note)}</span>`
    : '<span class="muted">Your table for this day will be shared on the morning.</span>';

  // agenda header
  $('agT').textContent = d.label + ': ' + d.title;
  $('agO').innerHTML = d.objective ? `<b>Objective</b>${esc(d.objective)}` : '';
  const date = new Date(d.date + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', timeZone:'UTC' });
  $('agM').textContent = date + '  |  ' + d.venue;

  // batches (Day 5)
  const hasB = !!d.batchLabels;
  $('batches').hidden = !hasB;
  $('batches').innerHTML = hasB ? d.batchLabels.map((l,i) => `<button data-b="${i}" class="${i===batch?'on':''}">${esc(l)}</button>`).join('') : '';

  // timeline
  const nm = nowMin();
  $('tl').innerHTML = d.sessions.map(s => {
    const [a,b] = hasB ? s.batches[batch] : [s.start, s.end];
    const live = isToday && nm >= mins(a) && nm < mins(b);
    const past = isToday && nm >= mins(b);
    const cls = ['s', s.type || '', live ? 'now' : '', past ? 'past' : ''].join(' ');
    const fb = /feedback/i.test(s.title) && CONFIG.surveyLink ? `<br><a class="fb" href="${esc(CONFIG.surveyLink)}" target="_blank" rel="noopener">Give feedback</a>` : '';
    return `<li class="${cls}"><div class="tm">${fmt(a)}<span>to ${fmt(b)}</span></div><div>
      <div class="tt">${esc(s.title)}${live ? '<span class="tag">NOW</span>' : ''}</div>
      ${s.detail ? `<div class="dd">${esc(s.detail)}</div>` : ''}
      ${s.owner ? `<div class="oo">${esc(s.owner)}</div>` : ''}
      ${fb}</div></li>`;
  }).join('');

  const n = $('note');
  n.hidden = !d.note;
  if (d.note) { const [h, ...r] = d.note.split(': '); n.innerHTML = r.length ? `<b>${esc(h)}.</b> ${esc(r.join(': '))}` : esc(d.note); }
  $('foot').textContent = CONFIG.footnote || '';

  // details
  $('prayer').innerHTML = CONFIG.prayerRoom.map(s => `<li>${esc(s)}</li>`).join('');
  const w = CONFIG.wifi;
  $('wifi').innerHTML = w.network ? `${esc(w.network)}${w.password ? ' &nbsp;Password: <span class="pw">' + esc(w.password) + '</span>' : ''}` : 'Details will be shared on the morning.';
  $('venue').textContent = d.venue;

  // survey
  const sv = $('survey');
  if (CONFIG.surveyLink) { sv.href = CONFIG.surveyLink; sv.classList.remove('off'); sv.textContent = 'Give feedback'; $('svT').textContent = 'Two minutes, and it helps us a lot.'; }
  else { sv.href = '#'; sv.classList.add('off'); sv.textContent = 'Survey link coming soon'; $('svT').textContent = 'The feedback survey will open here later in the day.'; }
}

// ---- attendance ----
const regKey = (n, dl) => n + '|' + dl;
function isReg(n, dl){ try { return !!JSON.parse(store.get('hk_reg') || '{}')[regKey(n, dl)]; } catch(e){ return false; } }
function setReg(n, dl){ let o = {}; try { o = JSON.parse(store.get('hk_reg') || '{}'); } catch(e){} o[regKey(n, dl)] = 1; store.set('hk_reg', JSON.stringify(o)); }
const live = () => CONFIG.supabaseUrl && CONFIG.supabaseKey;

function showModal(p, d){
  const t = p.t[day];
  $('mTitle').textContent = 'You have been marked present';
  $('mSub').textContent = p.n + ', ' + d.label;
  $('mTable').innerHTML = d.showTables === false ? '' : t ? 'Your table<b>' + esc(t) + '</b>' + (p.note ? '<span style="display:block;font-size:13px;margin-top:8px;white-space:pre-line;text-align:left">' + esc(p.note) + '</span>' : '') : p.note ? '<span style="display:block;font-size:14px;margin-top:4px;white-space:pre-line;text-align:left;color:#16162e">' + esc(p.note) + '</span>' : 'Your table will be shared on the morning.';
  $('mDemo').hidden = !!live();
  $('modal').hidden = false; $('mClose').focus();
}
$('mClose').onclick = () => { $('modal').hidden = true; };
$('modal').onclick = e => { if (e.target.id === 'modal') $('modal').hidden = true; };

$('register').onclick = async () => {
  const p = people[$('who').value], d = CONFIG.days[day], msg = $('regMsg'), btn = $('register');
  if (!p || !isOpen(d)) return;
  if (isReg(p.n, d.label)) { showModal(p, d); return; }
  if (!pending && !store.get('hk_me')) {
    pending = true; render();
    msg.textContent = 'Please check this is your name. After you confirm, this phone cannot be used for anyone else.';
    return;
  }
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Recording...';
  try {
    if (live()) {
      const r = await fetch(CONFIG.supabaseUrl.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '') + '/rest/v1/attendance', {
        method: 'POST',
        headers: Object.assign({ apikey: CONFIG.supabaseKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
                   CONFIG.supabaseKey.startsWith('eyJ') ? { Authorization: 'Bearer ' + CONFIG.supabaseKey } : {}),
        body: JSON.stringify({ name: p.n, day: d.label, device_id: deviceId() })
      });
      if (!r.ok) {
        let t = ''; try { t = (await r.text()).slice(0, 200); } catch(x){}
        if (r.status === 409 && t.indexOf('attendance_device_day') >= 0) {
          pending = false; btn.disabled = false; btn.textContent = 'Register attendance';
          msg.textContent = 'This phone has already been used to register someone else today. If this is a mistake, please ask the registration desk.';
          return;
        }
        if (r.status !== 409) throw new Error('HTTP ' + r.status + (t ? ' ' + t : ''));
      }
    }
    store.set('hk_me', p.n); pending = false; $('who').disabled = true;
    $('lockMsg').hidden = false; $('lockMsg').textContent = 'This phone is registered to ' + p.n + '. If this is wrong, please ask the registration desk.';
    setReg(p.n, d.label); render(); showModal(p, d);
  } catch (e) {
    pending = false; btn.disabled = false; btn.textContent = 'Register attendance';
    msg.textContent = 'We could not record your attendance. Check your connection and try again, or ask the registration desk.';
    const small = document.createElement('div'); small.style.cssText = 'font-size:11px;opacity:.7;margin-top:6px;word-break:break-all'; small.textContent = 'Details: ' + (e && e.message ? e.message : e); msg.appendChild(small);
  }
};
// ---- photo upload ----
$('cPhotos').hidden = CONFIG.photoUploads === false;
$('photoBtn').onclick = () => $('photoInput').click();
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'guest';
async function shrink(file){
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const max = 2400, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    if (blob && blob.size > 0) return { blob, type: 'image/jpeg', ext: 'jpg' };
  } catch (e) {}
  return { blob: file, type: file.type || 'image/jpeg', ext: (file.name.split('.').pop() || 'jpg').toLowerCase() };
}
$('photoInput').onchange = async e => {
  const files = Array.from(e.target.files || []); if (!files.length) return;
  const msg = $('photoMsg'), btn = $('photoBtn'), p = people[$('who').value], d = CONFIG.days[day];
  btn.disabled = true; btn.classList.add('off'); let ok = 0, fail = 0, lastErr = '';
  for (let i = 0; i < files.length; i++) {
    msg.textContent = 'Uploading photo ' + (i + 1) + ' of ' + files.length + '...';
    try {
      const s = await shrink(files[i]);
      if (live()) {
        const path = slug(d.label) + '/' + slug(p ? p.n : 'guest') + '/' + Date.now() + '-' + i + '.' + s.ext;
        const base = CONFIG.supabaseUrl.trim().replace(/\/rest\/v1\/?$/, '').replace(/\/$/, '');
        const r = await fetch(base + '/storage/v1/object/event-photos/' + path, { method: 'POST',
          headers: Object.assign({ apikey: CONFIG.supabaseKey, 'Content-Type': s.type, 'x-upsert': 'false' },
                     CONFIG.supabaseKey.startsWith('eyJ') ? { Authorization: 'Bearer ' + CONFIG.supabaseKey } : {}),
          body: s.blob });
        if (!r.ok) { let t = ''; try { t = (await r.text()).slice(0, 160); } catch(x){} throw new Error('HTTP ' + r.status + (t ? ' ' + t : '')); }
      }
      ok++;
    } catch (err) { fail++; lastErr = err && err.message ? err.message : String(err); }
  }
  btn.disabled = false; btn.classList.remove('off'); e.target.value = '';
  msg.textContent = (ok ? ok + (ok === 1 ? ' photo' : ' photos') + ' uploaded. Thank you!' : '') + (!live() && ok ? ' (Test mode: not saved.)' : '') +
    (fail ? (ok ? ' ' : '') + fail + ' could not be uploaded. Please try again. Details: ' + lastErr : '');
};
render();
</script>
</body>
